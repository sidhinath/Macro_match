services:
  - type: web
    name: macromatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard after the first deploy.
      # Leave it empty to run with fallback explanations (no Anthropic cost).
      - key: ANTHROPIC_API_KEY
        sync: false
    # Pin a version if Render's default changes under you:
    # - key: PYTHON_VERSION
    #   value: "3.12.7"
